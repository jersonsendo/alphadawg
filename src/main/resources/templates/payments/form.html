<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Generate Bill</title><link rel="stylesheet" th:href="@{/style.css}"></head>
<body>
<nav th:replace="~{layout :: nav}"></nav>
<main>
    <h1>Generate Bill</h1>
    <form th:action="@{/payments}" th:object="${payment}" method="post">
        <label>Pet</label>
        <select name="pet.id" required>
            <option th:each="p : ${pets}" th:value="${p.id}" th:text="${p.label}"></option>
        </select>
        <label>Description</label><input th:field="*{description}" placeholder="e.g. Check-up + vaccine" required>
        <label>Amount (PHP)</label><input type="number" step="0.01" min="0.01" th:field="*{amount}" required>
        <br><br>
        <button type="submit">Generate Bill</button>
        <a class="btn" th:href="@{/payments}">Back</a>
    </form>
</main>
</body>
</html>
