spring.application.name=vetclinic
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/vetclinic?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.thymeleaf.cache=false
spring.devtools.restart.enabled=true
spring.devtools.restart.additional-exclude=static/**,public/**
app.security.secure-cookies=false
app.security.require-https=false
server.servlet.session.cookie.same-site=lax
